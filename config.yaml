# Go2 PPO simulator configuration. Every key is optional: missing keys fall back to the defaults in
# utils/config.py (DEFAULT_CONFIG).  Edit here, or override on the command line / in the GUI.
# Reward weights: positive = reward, negative = penalty.  Paths are relative to the project root.
paths:
  urdf: assets/go2_description.urdf
  mesh_dirs:
  - assets/dae
  - assets
  models: models
  checkpoints: checkpoints
  logs: logs
  results: results
  cache: .cache
simulation:
  timestep: 0.004166666666666667
  control_freq: 50.0
  gravity: -9.81
  solver_iterations: 50
  max_episode_seconds: 20.0
  self_collision: true
  ground_friction: 0.9
  ground_restitution: 0.0
  foot_friction: 1.0
  contact_force_threshold: 1.0
  settle_seconds: 0.25
robot:
  base_link: base
  joint_order:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  foot_links:
  - FL_foot
  - FR_foot
  - RL_foot
  - RR_foot
  stance_height: 0.3
  hip_abduction: 0.1
  front_foot_x: 0.0
  rear_foot_x: -0.02
  target_base_height: 0.0
  terminate_on_links:
  - base
  - Head_upper
  - Head_lower
  fix_massless_links: true
control:
  kp: 40.0
  kd: 1.0
  action_scale: 0.25
  torque_speed_curve: true
  joint_damping: 0.01
  joint_friction: 0.03
  joint_limit_margin: 0.02
observation:
  scales:
    lin_vel: 2.0
    ang_vel: 0.25
    joint_vel: 0.05
    command:
    - 2.0
    - 2.0
    - 0.25
  clip: 10.0
  noise:
    lin_vel: 0.1
    ang_vel: 0.2
    gravity: 0.05
    joint_pos: 0.01
    joint_vel: 0.5
reward:
  weights:
    track_vx: 1.0
    track_vy: 0.6
    track_wz: 0.5
    alive: 0.2
    foot_contact: 0.1
    feet_air_time: 1.0
    orientation: -2.0
    base_height: -20.0
    lin_vel_z: -2.0
    ang_vel_xy: -0.05
    joint_vel: -0.0005
    joint_acc: -2.5e-07
    action_rate: -0.02
    energy: -0.0002
    foot_slip: -0.2
    default_pose: -0.05
    stall: -1.0
    body_contact: -1.0
    self_collision: -1.0
    fall: -20.0
  sigma_velocity: 0.15
  sigma_angular: 0.25
  air_time_threshold: 0.4
  target_base_height: 0.0
termination:
  max_roll: 1.0
  max_pitch: 1.0
  min_height_above_feet: 0.12
  arena_margin: 1.0
terrain:
  type: flat
  size: 16.0
  resolution: 0.08
  difficulty: 0.3
  max_height: 0.15
  min_height: 0.0
  roughness: 0.5
  obstacle_density: 0.6
  obstacle_size: 0.25
  slope_angle: 15.0
  stair_height: 0.12
  stair_width: 0.32
  friction: 0.9
  restitution: 0.0
  seed: 0
  spawn_pad: 1.5
  regen_every_episodes: 4
  random_type: false
randomization:
  enabled: true
  mass_scale:
  - 0.85
  - 1.15
  joint_damping_scale:
  - 0.5
  - 2.0
  friction:
  - 0.5
  - 1.3
  motor_strength:
  - 0.9
  - 1.1
  kp_scale:
  - 0.9
  - 1.1
  sensor_noise: true
  push_enabled: true
  push_interval_s:
  - 4.0
  - 9.0
  push_velocity: 0.5
  init_pos_xy: 0.3
  init_yaw: 0.4
  init_joint_noise: 0.1
commands:
  resample_seconds:
  - 3.0
  - 6.0
  vx:
  - -0.4
  - 0.8
  vy:
  - -0.4
  - 0.4
  wz:
  - -1.0
  - 1.0
  standing_probability: 0.1
  deadband: 0.1
curriculum:
  enabled: true
  eval_freq: 50000
  eval_episodes: 5
  eval_episode_seconds: 10.0
  difficulty_step: 0.15
  min_steps_per_stage: 100000
  stages:
  - name: 1_standing_balance
    enabled: true
    terrains:
    - flat
    difficulty:
    - 0.0
    - 0.0
    vx:
    - 0
    - 0
    vy:
    - 0
    - 0
    wz:
    - 0
    - 0
    randomization: false
    push: 0.0
    min_survival: 0.9
    max_vel_error: 0.12
  - name: 2_basic_walking
    enabled: true
    terrains:
    - flat
    difficulty:
    - 0.0
    - 0.0
    vx:
    - -0.5
    - 0.8
    vy:
    - 0
    - 0
    wz:
    - 0
    - 0
    randomization: false
    push: 0.0
    min_survival: 0.85
    max_vel_error: 0.25
  - name: 3_multidirectional
    enabled: true
    terrains:
    - flat
    difficulty:
    - 0.0
    - 0.0
    vx:
    - -0.6
    - 0.9
    vy:
    - -0.5
    - 0.5
    wz:
    - -1.2
    - 1.2
    randomization: true
    push: 0.0
    min_survival: 0.85
    max_vel_error: 0.3
  - name: 4_terrain_adaptation
    enabled: true
    terrains:
    - uneven
    - slopes
    - obstacles
    - rough
    - flat
    difficulty:
    - 0.1
    - 0.6
    vx:
    - -0.5
    - 0.8
    vy:
    - -0.4
    - 0.4
    wz:
    - -1.0
    - 1.0
    randomization: true
    push: 0.0
    min_survival: 0.8
    max_vel_error: 0.35
  - name: 5_robust_locomotion
    enabled: true
    terrains:
    - mixed
    - stairs
    - stepping
    - uneven
    - slopes
    - obstacles
    - rough
    difficulty:
    - 0.3
    - 1.0
    vx:
    - -0.5
    - 0.8
    vy:
    - -0.4
    - 0.4
    wz:
    - -1.0
    - 1.0
    randomization: true
    push: 1.0
    min_survival: 0.75
    max_vel_error: 0.4
ppo:
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 1024
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 1.0
  max_grad_norm: 1.0
  total_timesteps: 5000000
  net_arch_pi:
  - 256
  - 128
  - 64
  net_arch_vf:
  - 256
  - 128
  - 64
  activation: elu
  log_std_init: -0.7
  seed: 42
  n_envs: 4
  device: cpu
  checkpoint_freq: 100000
  snapshot_freq: 20000
evaluation:
  episodes_per_scenario: 3
  episode_seconds: 10.0
  seed: 1234
  pass_fall_rate: 0.2
  pass_vel_error: 0.3
  pass_completion: 0.7
gui:
  render_width: 480
  render_height: 300
  render_fps: 15
  realtime_factor: 1.0
